# org.keepassxc.KeePassXC is deliberately not in this list -- it's installed
# with --user below (needed for the raw-usb override) instead of system-wide.

# Core install-*.sh modules run by default (safe, no hardware assumptions,
# no security-sensitive changes, no external file dependencies).
CORE_MODULES=(
  install-git.sh
  install-firefox.sh
  install-communications.sh
  install-docker.sh
  install-starship.sh
  install-atuin.sh
  install-trashy.sh
  install-winehq.sh
  install-git-credential-manager.sh
  install-vcron.sh
  install-virtual-machines.sh
  install-zulu-jdk.sh
  install-yppa-manager.sh
  install-apart-gtk.sh
  install-angryipscanner.sh
  install-applauncher.sh
  install-drill-search.sh
  install-mouse-pointer-settings.sh
  install-tweaks.sh
)

# Optional modules: hardware-specific, security-sensitive, or dependent on
# external files. Not run unless explicitly requested with --with-<name>.
declare -A OPTIONAL_MODULES=(
  [webmin]=install-webmin.sh
  [mergerfs]=install-mergerfs.sh
  [sudoers-nopasswd]=install-add-sudoers-no-password.sh
  [vboxmanage-nopasswd]=install-vboxmanage-nopasswd.sh
  [xdg-user-dirs]=install-adjust-important-folders.sh
  [filebot-license]=install-and-activate-filebot-license.sh
  [apt-mirror]=install-apt-select-mirror.sh
)
