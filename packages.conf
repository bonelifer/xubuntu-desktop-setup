# shellcheck shell=bash disable=SC2034
# packages.conf
# Declarative package/repo lists consumed by install-main.sh.
# This is sourced as a bash file, so it must stay valid bash (arrays only).
# Add a new apt package, PPA, snap, or flatpak here instead of editing
# install-main.sh directly.

# PPAs installed via `add-apt-repository` (handles signing keys itself).
PPAS=(
  ppa:apt-fast/stable
  ppa:libreoffice/ppa
  ppa:savoury1/ffmpeg4
  ppa:savoury1/graphics
  ppa:savoury1/multimedia
  ppa:ubuntuhandbook1/puddletag
  ppa:ufleisch/kid3
  ppa:ondrej/php
  ppa:unit193/encryption
  ppa:atareao/atareao
  ppa:giuspen/ppa
  ppa:yktooo/ppa
  ppa:danielrichter2007/grub-customizer
  ppa:musicbrainz-developers/stable
)

# Core apt packages, installed with --install-recommends.
APT_PACKAGES=(
  acpi aisleriot alarm-clock-applet apache2-utils apt-fast apt-transport-https
  aria2 atfs audacity autoconf automake bison brasero build-essential
  cargo cheese cherrytree clementine cpu-x curl davfs2 deluge filezilla ffmpeg
  flatpak font-manager g++ gdebi-core gettext gigolo gnome-disk-utility gotify-indicator
  gnome-software-plugin-flatpak gnupg gnupg2 gobjc gfortran gparted gpodder
  gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly guvcview hardinfo htop
  indicator-sound-switcher kid3-qt krita libreoffice libffi-dev
  libgdbm-dev libgmp-dev libgranite-dev libncurses5-dev libpackagekit-glib2-dev
  libreadline-dev libsdl2-dev libssl-dev libtool libunity-dev libyaml-dev
  meson mc msmtp mpv nano net-tools ninja-build notification-daemon onedrive parole
  picard pluma preload puddletag pv putty python3-pip python3-venv p7zip-full p7zip-rar
  pkg-config r-base ruby-full sqlite3 sqlitebrowser spotify-client
  software-properties-common synaptic systray-x-minimal thunar-vcs-plugin tilda
  timeshift ubuntu-restricted-addons ubuntu-restricted-extras unzip valac variety
  veracrypt vlc wget winff xfce4-datetime-plugin xfce4-goodies xfce4-indicator-plugin
  xfce4-mount-plugin xfce4-mpc-plugin xfce4-power-manager xfce4-pulseaudio-plugin yarn
)

# php8.4 (current, actively supported) + common extensions
PHP_PACKAGES=(
  php8.4-fpm php8.4-common php8.4-mysql php8.4-gmp php8.4-curl php8.4-mbstring
  php8.4-gd php8.4-xml php8.4-readline php8.4-cli php8.4-zip php8.4-intl
  php8.4-bcmath php8.4-bz2 php8.4-cgi php8.4-pgsql
)

# Packages purged after the main install (superseded by preferred alternatives).
APT_PURGE_PACKAGES=(
  mousepad emacs-* vim vim-runtime emacs emacs-common emacs-gtk
)

# Node.js is intentionally not installed via snap here -- install-main.sh
# installs it via the NodeSource script (see install_core_packages) as the
# single source of truth, instead of also pulling in a PPA and an EOL
# Node 14 snap like the old script did.
SNAP_PACKAGES=(
  p7zip-desktop castersoundboard chromium
)

# name:channel:flags entries for snaps that need non-default install options
# (code and go both require classic confinement, which a plain `snap install`
# of them fails to grant).
SNAP_CLASSIC_PACKAGES=(
  "code::--classic"
  "go::--classic"
  "ubuntu-make::--classic"
)

FLATPAK_PACKAGES=(
  flathub:io.github.Pithos
  flathub:org.gnome.EasyTAG
  flathub:de.wagnermartin.Plattenalbum
  flathub:com.github.alexkdeveloper.recorder
  flathub:org.telegram.desktop
  flathub:com.hamrick.VueScan
  flathub:ca.desrt.dconf-editor
  flathub:dev.aunetx.deezer
  flathub:org.kde.kclock
  flathub:com.belmoussaoui.Decoder
  flathub:com.github.dail8859.NotepadNext
  flathub:org.pipewire.Helvum
  flathub:com.github.bcedu.vgrive
  flathub:org.openandroidinstaller.OpenAndroidInstaller
  flathub:com.github.muriloventuroso.easyssh
  flathub:com.zettlr.Zettlr
  flathub:org.tvbrowser.TVBrowser
  flathub:com.github.ryonakano.reco
  flathub:com.gitfiend.GitFiend
  flathub:org.bluesabre.MenuLibre
  flathub:net.sourceforge.squirrel_sql
  flathub:pl.youkai.nscan
